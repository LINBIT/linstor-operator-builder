apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    categories: Storage
    description: LINSTOR Operator deploys LINBIT SDS in the cluster.
    support: LINBIT
    capabilities: Full Lifecycle
    operatorframework.io/suggested-namespace: linbit-sds
    operators.openshift.io/valid-subscription: "['LINBIT SDS Subscription']"
    features.operators.openshift.io/disconnected: "true"
    features.operators.openshift.io/csi: "true"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    operators.operatorframework.io/project_layout: "go.kubebuilder.io/v4"
    operators.operatorframework.io/internal-objects: '["linstorsatellites.piraeus.io"]'
    com.redhat.openshift.versions: "v4.7"
  labels:
    operatorframework.io/arch.amd64: supported
    operatorframework.io/arch.arm64: supported
    operatorframework.io/os.linux: supported
  name: linstor-operator.v0.0.0
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: Cluster-wide configuration for LINSTOR.
      displayName: Linstor Cluster
      kind: LinstorCluster
      name: linstorclusters.piraeus.io
      version: v1
      resources:
        - kind: LinstorCluster
          name: linstorcluster
          version: v1
      statusDescriptors:
      - path: conditions
        displayName: Cluster Conditions
        description: Conditions describe the current state of the LINSTOR Cluster
        x-descriptors:
        - 'urn:alm:descriptor:io.kubernetes.conditions'
    - description: Configuration for connections between specific nodes.
      displayName: Linstor Node Connection
      kind: LinstorNodeConnection
      name: linstornodeconnections.piraeus.io
      version: v1
      resources:
      - kind: LinstorNodeConnection
        name: example-connection
        version: v1
      statusDescriptors:
      - path: conditions
        displayName: Node Connection Conditions
        description: Conditions describe the current state of the LINSTOR Node Connection
        x-descriptors:
        - 'urn:alm:descriptor:io.kubernetes.conditions'
    - description: Configuration for specific Satellites/Nodes in the LINSTOR Cluster.
      displayName: Linstor Satellite Configuration
      kind: LinstorSatelliteConfiguration
      name: linstorsatelliteconfigurations.piraeus.io
      version: v1
      resources:
      - kind: LinstorSatelliteConfiguration
        name: all-satellites
        version: v1
      statusDescriptors:
      - path: conditions
        displayName: Satellite Configuration Conditions
        description: Conditions decsribe the current state of the LINSTOR Satellite Configuration
        x-descriptors:
        - 'urn:alm:descriptor:io.kubernetes.conditions'
    - description: Resource to configure a single satellite, managed by the Operator itself.
      displayName: Linstor Satellite
      kind: LinstorSatellite
      name: linstorsatellites.piraeus.io
      version: v1
      resources:
      - kind: LinstorSatellite
        name: example-satellite
        version: v1
      specDescriptors:
      - path: clusterRef
        displayName: Cluster Reference
        description: Reference to the LINSTOR Cluster resource this Satellite is a part of.
      statusDescriptors:
      - path: conditions
        displayName: Satellite Conditions
        description: Conditions describe the current state of the LINSTOR Satellite
        x-descriptors:
        - 'urn:alm:descriptor:io.kubernetes.conditions'
  description: |
    ## Overview

    The LINSTOR Operator deploys and manages [LINBIT SDS](https://linbit.com/linbit-sds/), a resilient software-defined
    storage solution for OpenShift and Kubernetes built on [LINSTOR](https://github.com/LINBIT/linstor-server) and
    [DRBD](https://github.com/LINBIT/drbd).

    LINBIT SDS provides persistent storage volumes with synchronous replication across nodes, enabling high availability
    for stateful workloads. The operator handles the full lifecycle of all storage stack components — from initial
    deployment through upgrades and configuration changes.

    ## Components managed by the operator

    * **DRBD** — kernel-level block device replication
    * **LINSTOR Controller** — cluster-wide storage management plane
    * **LINSTOR Satellites** — per-node storage agents
    * **LINSTOR CSI Driver** — Kubernetes CSI integration for dynamic provisioning
    * **LINSTOR HA Controller** — automatic failover for stateful workloads

    ## Prerequisites

    A valid [LINBIT SDS Subscription](https://my.linbit.com) is required to pull the container images. The subscription
    credentials must be provided as an image pull secret named `drbdio-pull-secret` in the operator namespace
    (`linbit-sds` by default).

    ## Getting Started

    After installing the operator from OperatorHub, create the pull secret with your LINBIT credentials:

    ```
    oc create secret docker-registry drbdio-pull-secret \
      --namespace=linbit-sds \
      --docker-server=drbd.io \
      --docker-username=MY_LINBIT_USER \
      --docker-password=MY_LINBIT_PASSWORD
    ```

    Then deploy the full LINBIT SDS stack by creating a `LinstorCluster` resource:

    ```yaml
    apiVersion: piraeus.io/v1
    kind: LinstorCluster
    metadata:
      name: linstorcluster
    spec: {}
    ```

    The operator will deploy all components and configure the CSI driver. Storage backends and storage classes
    must be configured separately based on the available storage on your nodes.

    ## Configuring Storage

    Storage pools are configured via `LinstorSatelliteConfiguration`. The following example sets up an LVM thin pool
    on a dedicated disk on every node:

    ```yaml
    apiVersion: piraeus.io/v1
    kind: LinstorSatelliteConfiguration
    metadata:
      name: storage-pool
    spec:
      storagePools:
        - name: pool1
          lvmThinPool: {}
          source:
            hostDevices:
              - /dev/sdb
    ```

    Once the pool is configured, create a `StorageClass` referencing it. The example below provisions replicated
    volumes with 2 replicas:

    ```yaml
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: linbit-sds
    provisioner: linstor.csi.linbit.com
    allowVolumeExpansion: true
    volumeBindingMode: WaitForFirstConsumer
    parameters:
      linstor.csi.linbit.com/storagePool: pool1
      linstor.csi.linbit.com/placementCount: "2"
    ```

    ## Documentation

    * [User Guide](https://linbit.com/drbd-user-guide/linstor-guide-1_0-en/#s-kubernetes-deploy-linstor-operator-v2)
    * [API Reference](https://linbit.github.io/linstor-operator-builder/)
    * [Source Code](https://github.com/LINBIT/linstor-operator-builder)
  displayName: LINSTOR Operator
  icon:
  - base64data: |
      
    mediatype: image/svg+xml
  maintainers:
  - name: LINBIT
    email: support@linbit.com
  install:
    strategy: deployment
  installModes:
  - supported: true
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: false
    type: AllNamespaces
  keywords:
  - storage
  links:
  - name: User Guide
    url: https://linbit.com/drbd-user-guide/linstor-guide-1_0-en/
  - name: LINSTOR Operator
    url: https://charts.linstor.io/
  - name: Source Code
    url: https://github.com/LINBIT/linstor-operator-builder
  maturity: stable
  minKubeVersion: 1.20.0
  provider:
    name: LINBIT
    url: https://linbit.com
