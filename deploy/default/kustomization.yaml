# Adds namespace to all resources.
namespace: linbit-sds

namePrefix: linstor-operator-
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: linbit-sds

patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: gencert
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: drbdio-pull-secret
  target:
    kind: Deployment
    name: gencert
- path: gencert_rbac_patch.yaml

images:
- name: controller
  newName: drbd.io/linstor-operator
  newTag: v2.10.6

resources:
- ../operator
- ../../piraeus-operator/config/gencert

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
replacements:
- source:
    kind: Service
    name: webhook-service
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=gencert].env.[name=WEBHOOK_SERVICE_NAME].value
    select:
      kind: Deployment
      name: gencert
- source:
    kind: ValidatingWebhookConfiguration
    name: validating-webhook-configuration
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=gencert].env.[name=WEBHOOK_CONFIGURATION_NAME].value
    select:
      kind: Deployment
      name: gencert
  - fieldPaths:
    - rules.0.resourceNames.0
    select:
      kind: ClusterRole
      name: gencert
- source:
    fieldPath: metadata.name
    kind: ConfigMap
    name: image-config
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=manager].env.[name=IMAGE_CONFIG_MAP_NAME].value
    select:
      kind: Deployment
      name: controller-manager
