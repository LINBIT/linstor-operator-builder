---
base: drbd.io
components:
  linstor-controller:
    tag: v1.31.0
    image: linstor-controller
  linstor-satellite:
    tag: v1.31.0
    image: linstor-satellite
  linstor-csi:
    tag: v1.7.1
    image: linstor-csi
  drbd-reactor:
    tag: v1.8.0
    image: drbd-reactor
  ha-controller:
    tag: v1.3.0
    image: linstor-k8s-ha-controller
  drbd-shutdown-guard:
    tag: v1.0.0
    image: drbd-shutdown-guard
  ktls-utils:
    tag: v0.11
    image: ktls-utils
  drbd-module-loader:
    tag: v9.2.13
    image: drbd9-noble # Fallback image: chose a recent kernel, which can hopefully compile whatever config is actually in use
    match:
      - osImage: Red Hat Enterprise Linux Server 7\.
        image: drbd9-rhel7
        precompiled: true
      - osImage: Red Hat Enterprise Linux 8\.
        image: drbd9-rhel8
        precompiled: true
      - osImage: Red Hat Enterprise Linux 9\.
        image: drbd9-rhel9
        precompiled: true
      - osImage: Red Hat Enterprise Linux 10\.
        image: drbd9-rhel10
        precompiled: true
      - osImage: "Red Hat Enterprise Linux CoreOS 9|(41[3-9])"
        image: drbd9-rhel9
        precompiled: true
      - osImage: Red Hat Enterprise Linux CoreOS
        image: drbd9-rhel8
        precompiled: true
      - osImage: CentOS Linux 7
        image: drbd9-rhel7
        precompiled: true
      - osImage: CentOS Linux 8
        image: drbd9-rhel8
        precompiled: true
      - osImage: AlmaLinux 8
        image: drbd9-rhel8
        precompiled: true
      - osImage: AlmaLinux 9
        image: drbd9-rhel9
        precompiled: true
      - osImage: AlmaLinux 10
        image: drbd9-rhel10
        precompiled: true
      - osImage: Oracle Linux Server 8\.
        image: drbd9-rhel8
        precompiled: true
      - osImage: Oracle Linux Server 9\.
        image: drbd9-rhel9
        precompiled: true
      - osImage: Oracle Linux Server 10\.
        image: drbd9-rhel9
        precompiled: true
      - osImage: Rocky Linux 8
        image: drbd9-rhel8
        precompiled: true
      - osImage: Rocky Linux 9
        image: drbd9-rhel9
        precompiled: true
      - osImage: Rocky Linux 10
        image: drbd9-rhel10
        precompiled: true
      - osImage: Amazon Linux 2
        image: drbd9-amzn2
      - osImage: Ubuntu 18\.04
        image: drbd9-bionic
      - osImage: Ubuntu 20\.04
        image: drbd9-focal
      - osImage: Ubuntu 22\.04
        image: drbd9-jammy
      - osImage: Ubuntu 24\.04
        image: drbd9-noble
      - osImage: Harvester
        image: drbd9-sles15
        precompiled: true
