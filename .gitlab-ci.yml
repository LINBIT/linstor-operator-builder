stages:
  - prepare
  - build
  - test
  - deploy

include:
  - project: kubernetes/linstor-kubernetes-tests
    ref: v2.12.0
    file: k8s-test.gitlab-ci.yml

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  KUSTOMIZE_VERSION: v5.8.1
  HELM_VERSION: v4.2.0

prepare-bins:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'v2'
  image: ${LINBIT_DOCKER_REGISTRY}/build-helpers:latest
  stage: prepare
  script:
    - . /usr/local/bin/gitlab-utils.sh
    - ci_prepare_tools
    - ci_fetch_tar kustomize-$KUSTOMIZE_VERSION "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -z
    - ci_fetch_tar helm-$HELM_VERSION "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -z
  cache:
    key: bin-$KUSTOMIZE_VERSION-$HELM_VERSION
    paths:
      - download
  artifacts:
    paths:
      - download
      - bin

prepare-k8s-test-bins:
  extends: .k8s-test-prepare
  stage: prepare
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'v2'

create-k8s-test-configs:
  extends: .k8s-test-configs
  stage: prepare
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'v2'
  variables:
    K8S_TEST_FIXED_VERSIONS: "v1.30"
    K8S_TEST_INCLUDE_NEXT: "false"
    K8S_TEST_RANDOMIZE_CNI: "false"
    K8S_TEST_RANDOMIZE_CRI: "false"

# A single deterministic platform for the opt-in kubevirt and shared storage
# tests: latest stable Kubernetes with containerd and flannel. Those tests cover
# LINSTOR behavior on KubeVirt and shared storage, not the Kubernetes matrix.
create-k8s-test-configs-opt-in:
  extends: .k8s-test-configs
  stage: prepare
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'v2'
  variables:
    K8S_TEST_RELEASES_TO_CHECK: "1"
    K8S_TEST_INCLUDE_NEXT: "false"
    K8S_TEST_RANDOMIZE_CNI: "false"
    K8S_TEST_RANDOMIZE_CRI: "false"

build_operator:
  image: ${LINBIT_DOCKER_REGISTRY}/container-tools:latest
  variables:
    TAG: v2-dev-${CI_COMMIT_SHORT_SHA}
    VERSION: $TAG-$CI_COMMIT_SHA
    NOCACHE: "false"
    PLATFORMS: ${PUBLISH_PLATFORMS}
    REGISTRY: ${LINBIT_DOCKER_REGISTRY}/linstor-operator-test
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        TAG: $CI_COMMIT_TAG
        NOCACHE: "true"
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'v2'
  stage: build
  script:
    - docker buildx bake --pull --push --no-cache=$NOCACHE
    - echo "OPERATOR_IMAGE=$LINBIT_DOCKER_REGISTRY/linstor-operator-test/linstor-operator:$TAG" > .build.env
  artifacts:
    reports:
      dotenv:
        - .build.env

build_static_deployment:
  image:
    name: python:3
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'v2'
  stage: build
  before_script:
    - mkdir -p .cache/pip
    - pip install --cache-dir .cache/pip pyyaml
  script:
    - make out/static-deployment.yaml out/image.list KUSTOMIZE=bin/kustomize
  cache:
    key: cache-python
    paths:
      - .cache/pip
  artifacts:
    paths:
      - out/static-deployment.yaml
      - out/image.list

build_helm_deployment:
  image:
    name: python:3
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'v2'
  stage: build
  script:
    - bin/helm package charts/linbit-sds charts/linstor-operator
  cache:
  artifacts:
    paths:
      - "*.tgz"

container_scanning:
  stage: test
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'v2'
    - if: $CI_COMMIT_TAG
  image:
    name: "${LINBIT_DOCKER_REGISTRY}/trivy:latest"
    entrypoint: [""]
  script:
    - trivy --version
    - trivy image --exit-code 0 --format template --template "@/contrib/html.tpl" -o container-scan.html "$OPERATOR_IMAGE"
    # Prints full report
    - trivy image --exit-code 0 "$OPERATOR_IMAGE"
    # Fail on critical (unfixed) vulnerabilities
    - trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL "$OPERATOR_IMAGE"
  # Ideally, we would use container_scanning for the artifact here. That is currently a paid feature, so we have to use code quality
  artifacts:
    when: always
    expose_as: "Container Scan"
    paths:
      - container-scan.html

.test:
  extends: .k8s-test
  needs:
    - prepare-bins
    - prepare-k8s-test-bins
    - create-k8s-test-configs
    - build_operator
  before_script:
    - ( cd deploy/debug ; $CI_PROJECT_DIR/bin/kustomize edit set image drbd.io/linstor-operator=$OPERATOR_IMAGE )
    - cp -a --parents deploy piraeus-operator/config virter/
  variables:
    K8S_TEST_DEPLOYMENT_SOURCE: /virter/workspace/deploy/debug
    K8S_TEST_VMSHED_EXTRA_ARGS: --error-details=false

# The opt-in tests, on the single platform of create-k8s-test-configs-opt-in.
.test-opt-in:
  extends: .test
  needs:
    - prepare-bins
    - prepare-k8s-test-bins
    - create-k8s-test-configs-opt-in
    - build_operator
  variables:
    # Have virter-gc free 100 GiB (in bytes) for larger nested VMs.
    VIRTER_GC_MIN_FREE: "107374182400"

test-fast:
  extends: .test
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'v2'
    - if: $CI_COMMIT_TAG
  timeout: 1h
  variables:
    K8S_TEST_TORUN: operator
    K8S_TEST_VARIANT: dualstack

test-full:
  timeout: 8h
  extends: .test
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == 'v2'
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  variables:
    K8S_TEST_SKIP: "Slow|LinuxOnly|xfs|ext3|ext4|immediate-binding|retain policy|readOnly|read-only|exec|subPath"
    # The network variants only: an empty variant would also run the opt-in
    # kubevirt and shared variants, which have their own jobs below.
    K8S_TEST_VARIANT: "ipv4,ipv6,dualstack"

# Runs the upstream KubeVirt e2e suite against LINSTOR, with live migration
# exercising DRBD dual-primary through RWX block volumes.
test-kubevirt:
  extends: .test-opt-in
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == 'v2'
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  timeout: 7h
  variables:
    K8S_TEST_VARIANT: kubevirt
    K8S_TEST_TORUN: kubevirt

# Runs the storage e2e and KubeVirt suites against a storage pool on a disk
# shared between all VMs, locked by LINSTOR and by lvmlockd, without DRBD.
test-shared:
  extends: .test-opt-in
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == 'v2'
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  # The two kubevirt tests run side by side, the e2e tests fill the rest of the
  # runner around them.
  timeout: 8h
  variables:
    K8S_TEST_VARIANT: shared

publish-debug:
  stage: deploy
  image:
    name: python:3
    entrypoint: [ "" ]
  rules:
  - if: $CI_COMMIT_BRANCH == 'v2'
  - if: $CI_MERGE_REQUEST_ID
    when: manual
    allow_failure: true
  before_script:
  - mkdir -p .cache/pip
  - pip install --cache-dir .cache/pip pyyaml pulp-cli
  - mkdir -p ~/.config/pulp && ln -snf "$LINBIT_PULP_CONFIG_FILE" ~/.config/pulp/cli.toml
  script:
  - set -ex
  - export PATH=$CI_PROJECT_DIR/bin:$PATH
  - ( cd deploy/debug ; kustomize edit set image drbd.io/linstor-operator=$OPERATOR_IMAGE )
  - mkdir -p out
  - kustomize build deploy/debug > out/static-deployment.yaml
  - hack/get-image-list.py out/static-deployment.yaml > out/image.list
  - pulp file content upload --repository pages --file out/static-deployment.yaml --relative-path linstor-operator/$CI_COMMIT_REF_SLUG.yaml
  - pulp file content upload --repository pages --file out/image.list --relative-path linstor-operator/$CI_COMMIT_REF_SLUG.image.txt
  cache:
    key: cache-python
    paths:
    - .cache/pip

publish-image:
  stage: deploy
  image: ${LINBIT_DOCKER_REGISTRY}/container-tools:latest
  variables:
    DOCKER_AUTH_CONFIG_FROM: DOCKER_PUBLISH_AUTH_CONFIG_FILE
    REGISTRY: ${PUBLISH_REGISTRY}
    PLATFORMS: ${PUBLISH_PLATFORMS}
    TAG: v2-dev-${CI_COMMIT_SHORT_SHA}
    VERSION: $TAG-$CI_COMMIT_SHA
  rules:
  - if: $CI_COMMIT_BRANCH == 'v2'
    when: manual
    allow_failure: true
  - if: $CI_COMMIT_TAG
    variables:
      TAG: $CI_COMMIT_TAG
  script:
    - docker buildx bake --pull --push

publish-config:
  stage: deploy
  image:
    name: python:3
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        RELEASE_VERSION: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == 'v2'
      when: manual
      allow_failure: true
      variables:
        RELEASE_VERSION: v2.99.0+$CI_COMMIT_REF_SLUG.$CI_COMMIT_SHORT_SHA
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
      variables:
        RELEASE_VERSION: v2.99.0+$CI_COMMIT_REF_SLUG.$CI_COMMIT_SHORT_SHA
  variables:
    UPSTREAM: git@github.com:LINBIT/linstor-operator-builder.git
    GIT_AUTHOR_NAME: LinbitPRBot
    GIT_COMMITTER_NAME: LinbitPRBot
    GIT_AUTHOR_EMAIL: linbitprbot@users.noreply.github.com
    GIT_COMMITTER_EMAIL: linbitprbot@users.noreply.github.com
  before_script:
    - mkdir -p .cache/pip
    - pip install --cache-dir .cache/pip pyyaml semver
  script:
    - mkdir -p $HOME/.ssh
    - ln -snf $GITHUB_KNOWN_HOSTS $HOME/.ssh/known_hosts
    - eval $(ssh-agent -s)
    - cat $GITHUB_DEPLOY_KEY | ssh-add -
    - git clone -b gh-pages --single-branch --depth=1 "$UPSTREAM" gh-pages
    - mkdir -p gh-pages/static
    - cp --no-clobber -t gh-pages *.tgz
    - cp out/static-deployment.yaml "gh-pages/static/$RELEASE_VERSION.yaml"
    - cp out/image.list "gh-pages/static/$RELEASE_VERSION.image-list.txt"
    - if [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
    -   ln -snf "$RELEASE_VERSION.yaml" "gh-pages/static/latest.yaml"
    -   ln -snf "$RELEASE_VERSION.image-list.txt" "gh-pages/static/latest.image-list.txt"
    - fi
    - hack/generate-release-info.py gh-pages/static | tee gh-pages/content/releases.json
    - bin/helm repo index --url https://charts.linstor.io gh-pages
    - git -C gh-pages add .
    - git -C gh-pages diff --staged
    - if [ -n "$CI_COMMIT_TAG" ]; then
    -   git -C gh-pages commit -m "Release $RELEASE_VERSION"
    -   git -C gh-pages push "$UPSTREAM" gh-pages:gh-pages
    - fi
  cache:
    key: cache-python
    paths:
      - .cache/pip
  artifacts:
    paths:
      - gh-pages/static
      - gh-pages/content

build_bundle:
  image: ${LINBIT_DOCKER_REGISTRY}/container-tools:latest
  variables:
    CHANNELS: dev
  rules:
  - if: $CI_COMMIT_TAG
    needs:
      - job: publish-image
    variables:
      CHANNELS: stable,dev
  - if: $CI_MERGE_REQUEST_ID
    when: manual
    allow_failure: true
  - if: $CI_COMMIT_BRANCH == 'v2'
    when: manual
    allow_failure: true
  stage: deploy
  script:
  - make bundle CHANNELS=$CHANNELS
  artifacts:
    paths:
    - bundle
